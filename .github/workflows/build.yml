name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Preparar projeto
        run: |
          if [ -f build.gradle ]; then mkdir -p work && cp -r . work/SkinArmor 2>/dev/null || true; else mkdir -p work && unzip -q ./*.zip -d work; fi
          ls work
      - name: Baixar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Compilar
        run: |
          cd work/SkinArmor
          ../../gradle-2.14.1/bin/gradle setupCIWorkspace --no-daemon
          ../../gradle-2.14.1/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SkinArmor-jar
          path: work/SkinArmor/build/libs/*.jar
